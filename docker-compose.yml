services: 
  mysql:
    container_name: mysql
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=Test@121
      - MYSQL_DATABASE=bankappdb
    ports:
      - 3306:3306
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - bankapp
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  bankapp:
    container_name: ai-bank-app
    image: cloudwithrk/ai-bank-app:latest
    environment:
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bankappdb?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_DATABASE=bankappdb
      - SPRING_DATASOURCE_PASSWORD=Test@121
    networks:
      - bankapp
    ports:
      - 8080:8080
    restart: always
    depends_on:
      mysql:
        condition: service_healthy

    
networks:
  bankapp:
volumes:
  mysql-data:
