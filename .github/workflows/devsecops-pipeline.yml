name: End to End DevSecOps Pipeline

on:
    push:
        branches: [ rajendra ]
jobs:
    code-linter:
        uses: ./.github/workflows/code-linter-scan.yml
        secrets: inherit

    code-quality:
        uses: ./.github/workflows/code-quality-scan.yml
        secrets: inherit

    docker-file:
        uses: ./.github/workflows/docker-file-scan.yml
    
    secrets:
        uses: ./.github/workflows/secrets-scan.yml
    
    build-and-push:
        uses: ./.github/workflows/docker-build-push.yml
        needs: [code-quality,docker-file,secrets]